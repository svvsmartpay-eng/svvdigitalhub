version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: svv-ams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: svvams
      POSTGRES_PASSWORD: svvams_dev_2026
      POSTGRES_DB: svv_ams
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svvams -d svv_ams"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: svv-ams-redis
    restart: unless-stopped
    command: redis-server --requirepass svvams_redis_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "svvams_redis_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: svv-ams-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
